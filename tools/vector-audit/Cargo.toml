[package]
name = "reallyme-jose-vector-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.23"
ed25519-dalek = "3"
hex = "0.4"
k256 = { version = "0.14", features = ["ecdsa"] }
p256 = { version = "0.14", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace]

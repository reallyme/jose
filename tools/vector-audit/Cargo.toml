[package]
name = "reallyme-jose-vector-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdsa"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace]

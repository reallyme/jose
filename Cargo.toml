[workspace]
resolver = "2"
members = ["crates/jose", "crates/ffi", "crates/proto", "crates/wasm"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/jose"

[workspace.dependencies]
reallyme-codec = { version = "=0.4.5", default-features = false }
reallyme-jose-proto = { version = "0.6.0", path = "crates/proto", default-features = false }
reallyme-crypto = { version = "0.4.5", default-features = false }
buffa = { package = "reallyme-buffa", version = "=0.1.3", features = ["json", "zeroize"] }
secrecy = "0.10.3"
subtle = "2.6.1"
base64 = "0.23.1"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.2"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
jni = "0.22.4"
wasm-bindgen-test = "=0.3.80"
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# Native libraries cross C and JNI boundaries whose panic firewall requires
# unwinding. Artifact builders select this profile explicitly so the policy is
# not vulnerable to RUSTFLAGS or Cargo encoded-flag precedence.
[profile.release-ffi]
inherits = "release"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
large_include_file = "deny"
missing_const_for_fn = "deny"
must_use_candidate = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[workspace]
resolver = "2"
members = ["crates/jose", "crates/ffi", "crates/proto", "crates/wasm"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/jose"
publish = false

[workspace.dependencies]
reallyme-codec = { version = "0.2.3", default-features = false }
reallyme-jose-proto = { version = "0.4.0", path = "crates/proto", default-features = false }
reallyme-crypto = { version = "0.3.7", default-features = false }
buffa = { version = "0.9.2", features = ["json"] }
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
zeroize = "1.9"
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
jni = "0.22.4"
wasm-bindgen-test = "=0.3.77"
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# Native libraries cross C and JNI boundaries whose panic firewall requires
# unwinding. Artifact builders select this profile explicitly so the policy is
# not vulnerable to RUSTFLAGS or Cargo encoded-flag precedence.
[profile.release-ffi]
inherits = "release"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
as_conversions = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
large_include_file = "deny"
missing_const_for_fn = "deny"
must_use_candidate = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

version: v2
clean: true
plugins:
  # Rust Buffa message/view types. Jose checks in generated bindings instead
  # of using build.rs so downstream release builds are deterministic.
  - local: protoc-gen-reallyme-buffa
    strategy: all
    out: crates/proto/src/generated/buffa
    opt:
      - views=true
      - borrowed_views_only_in=.reallyme.jose.v1
      - json=true
      - zeroize_in=.reallyme.jose.v1
      - unknown_fields=false
      - deny_unknown_json_fields=true
      - bytes_type_custom_in=.reallyme.jose.v1=crate::SecretBytes
      - string_type_custom_in=.reallyme.jose.v1=crate::SecretString
      - json_policy_type=crate::SecretBytes
      - json_policy_type=crate::SecretString
  - local: protoc-gen-reallyme-buffa-packaging
    out: crates/proto/src/generated/buffa
    strategy: all

  # TypeScript types are checked in for deterministic npm builds. The typed
  # facade consumes these generated messages rather than maintaining a second
  # hand-written wire contract.
  - remote: buf.build/bufbuild/es:v2.17.0
    out: packages/ts/src/proto/generated
    opt:
      - target=ts

  # SwiftProtobuf types are bundled behind the typed Swift SDK facade. Keep the
  # generator version aligned with the package dependency and release policy.
  - remote: buf.build/apple/swift:v1.39.0
    out: gen/swift
    opt:
      - Visibility=Public

  # Java Lite and Kotlin Lite bindings are implementation details of the
  # typed JVM facade. Pin both generators to the matching runtime release.
  - remote: buf.build/protocolbuffers/java:v36.2
    out: gen/java
    opt:
      - lite
  - remote: buf.build/protocolbuffers/kotlin:v36.2
    out: gen/kotlin
    opt:
      - lite

# Coverage-guided fuzzing harnesses for JOSE's untrusted compact parsers.
#
# This crate is deliberately outside the main workspace so libFuzzer's
# `#![no_main]` runtime and unsafe internals do not inherit production lint
# denies from the release crate.

[package]
name = "jose-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reallyme-jose = { path = "../crates/jose", features = ["native", "wire"] }
reallyme-jose-ffi = { path = "../crates/ffi" }
reallyme-crypto = { version = "0.3.4", default-features = false, features = ["jwk"] }
serde_json = "1.0"

[[bin]]
name = "compact_jwe"
path = "fuzz_targets/compact_jwe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_jwe_ecdh_es"
path = "fuzz_targets/compact_jwe_ecdh_es.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_jwe_header"
path = "fuzz_targets/parse_jwe_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_jws_es256"
path = "fuzz_targets/compact_jws_es256.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_jwt"
path = "fuzz_targets/signed_jwt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_jwt_temporal"
path = "fuzz_targets/validate_jwt_temporal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unsigned_jwt"
path = "fuzz_targets/unsigned_jwt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "operation_wire"
path = "fuzz_targets/operation_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "operation_response"
path = "fuzz_targets/operation_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_operation"
path = "fuzz_targets/ffi_operation.rs"
test = false
doc = false
bench = false

[workspace]

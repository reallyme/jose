[package]
name = "reallyme-jose-ffi"
version = "0.5.2"
description = "ReallyMe JOSE native C ABI operation-contract adapter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["native"]
native = ["reallyme-crypto/native", "reallyme-jose/native"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
buffa = { workspace = true }
jni = { workspace = true }
reallyme-crypto = { workspace = true, features = ["csprng"] }
reallyme-jose-proto = { workspace = true, features = ["generated"] }
reallyme-jose = { version = "0.5.2", path = "../jose", default-features = false, features = ["wire"] }
thiserror = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true

[package]
name = "reallyme-jose"
version = "0.3.0"
description = "JOSE, JWT, JWS, and JWE helpers for ReallyMe identity."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/reallyme-jose"
categories = ["authentication", "cryptography", "encoding"]
keywords = ["jose", "jwt", "jws", "jwe", "reallyme"]
publish = true
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.cargo_check_external_types]
# These dependencies deliberately define the algorithm selectors, provider
# traits, JSON value model, zeroizing owners, and generated wire contract in
# the supported public API.
allowed_external_types = [
    "buffa::message::Message",
    "codec_base64url::error::Base64UrlError",
    "crypto_core::algorithm::Algorithm",
    "crypto_csprng::rng::SecureRandom",
    "crypto_dispatch::error::AlgorithmError",
    "crypto_signer::signer::Signer",
    "envelopes_jwk::jwk::Jwk",
    "reallyme_jose_proto::*",
    "serde_core::de::Deserialize",
    "serde_core::de::DeserializeOwned",
    "serde_core::ser::Serialize",
    "serde_json::error::Error",
    "serde_json::value::Value",
    "zeroize::Zeroizing",
]

[features]
default = ["native"]
native = ["jose-crypto", "reallyme-crypto/native"]
wasm = ["jose-crypto", "reallyme-crypto/wasm"]
wire = ["dep:buffa", "dep:reallyme-jose-proto"]
jose-crypto = [
    "reallyme-crypto/dispatch",
    "reallyme-crypto/signer",
    "reallyme-crypto/jwk",
    "reallyme-crypto/aes",
    "reallyme-crypto/concat-kdf",
    "reallyme-crypto/csprng",
    "reallyme-crypto/ed25519",
    "reallyme-crypto/p256",
    "reallyme-crypto/p384",
    "reallyme-crypto/p521",
    "reallyme-crypto/secp256k1",
]

[dependencies]
buffa = { workspace = true, optional = true }
reallyme-codec = { workspace = true, features = ["base64", "base64url"] }
reallyme-crypto = { workspace = true }
reallyme-jose-proto = { workspace = true, features = ["generated"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true

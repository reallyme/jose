name: npm Package Release
run-name: npm package release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.3.0

permissions:
  contents: read

concurrency:
  group: npm-package-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  WASM_BINDGEN_CLI_VERSION: 0.2.126
  WASM_PACK_VERSION: 0.15.0

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      preflight_run_id: ${{ steps.attestation.outputs.preflight_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Resolve current release SHA
        run: |
          git fetch --no-tags origin main
          release_sha="$(git rev-parse origin/main)"
          if [ "${GITHUB_SHA}" != "${release_sha}" ]; then
            echo "::error::resolved release SHA does not match the workflow run head SHA"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: attestation
        name: Require current main and successful npm package checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: npm-package-preflight.yml
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: "1"
        run: |
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"
          node scripts/verify_release_attestation.mjs

  package:
    name: build and verify immutable npm package
    needs: verify-release-sha
    runs-on: ubuntu-24.04
    outputs:
      tarball_sha256: ${{ steps.tarball.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}
      - name: Install TypeScript dependencies
        run: npm ci --prefix packages/ts
      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/run_pinned_release_readiness.mjs --release-packages
      - name: Test TypeScript package and WASM provider
        run: npm --prefix packages/ts test
      - name: Verify npm tarball and WASM surface
        run: npm --prefix packages/ts run pack:check
      - id: tarball
        name: Build immutable npm tarball
        working-directory: packages/ts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ../../build/npm
          npm pack --ignore-scripts --pack-destination ../../build/npm
          artifact="../../build/npm/reallyme-jose-${RELEASE_VERSION}.tgz"
          if [ ! -f "${artifact}" ]; then
            echo "::error::npm did not create the expected tarball"
            exit 1
          fi
          cd ../../build/npm
          sha256sum "reallyme-jose-${RELEASE_VERSION}.tgz" > "reallyme-jose-${RELEASE_VERSION}.tgz.sha256"
          tarball_sha256="$(sha256sum "reallyme-jose-${RELEASE_VERSION}.tgz" | cut -d ' ' -f 1)"
          echo "tarball_sha256=${tarball_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Upload immutable npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-jose-npm-${{ inputs.version }}-${{ needs.verify-release-sha.outputs.release_sha }}
          path: |
            build/npm/reallyme-jose-${{ inputs.version }}.tgz
            build/npm/reallyme-jose-${{ inputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish verified npm package
    needs: [verify-release-sha, package]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download verified npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-jose-npm-${{ inputs.version }}-${{ needs.verify-release-sha.outputs.release_sha }}
          path: build/npm
      - name: Promote exact verified npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: npm-package-preflight.yml
          RELEASE_ATTESTATION_PREFLIGHT_RUN_ID: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
          EXPECTED_TARBALL_SHA256: ${{ needs.package.outputs.tarball_sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is required"
            exit 1
          fi
          node scripts/verify_release_attestation.mjs
          cd build/npm
          if [[ ! "${EXPECTED_TARBALL_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::package job tarball digest is missing or malformed"
            exit 1
          fi
          actual_sha256="$(sha256sum "reallyme-jose-${RELEASE_VERSION}.tgz" | cut -d ' ' -f 1)"
          if [ "${actual_sha256}" != "${EXPECTED_TARBALL_SHA256}" ]; then
            echo "::error::downloaded npm tarball does not match the package job output"
            exit 1
          fi
          sha256sum --check "reallyme-jose-${RELEASE_VERSION}.tgz.sha256"
          npm publish "reallyme-jose-${RELEASE_VERSION}.tgz" --provenance --access public

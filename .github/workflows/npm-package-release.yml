name: npm Package Release
run-name: Publish npm ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from the successful package preflight
        required: true
        type: string
      source_sha:
        description: Full source SHA from this ecosystem's successful package preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-package-release-${{ inputs.version }}
  cancel-in-progress: false


jobs:
  verify-release-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: ${{ inputs.source_sha == '9aeae6356b65512a2c53832c46719de36e1d7e86' && '5a7c5b4785a2c47589dca7f18be11ed99d5dd7b8' || '55115f21d5bf9a3fbc1bb8d10484aecba6e7bd8f' }}
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release npm publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

  publish:
    name: publish verified npm package
    needs: verify-release-sha
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          path: build/npm
          merge-multiple: true
          digest-mismatch: error
      - name: Promote exact verified npm tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is required"
            exit 1
          fi
          cd build/npm
          sha256sum --check "reallyme-jose-${RELEASE_VERSION}.tgz.sha256"
          npm publish "reallyme-jose-${RELEASE_VERSION}.tgz" --provenance --access public

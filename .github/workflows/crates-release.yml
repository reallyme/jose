name: Crates.io Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-release-main
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      preflight_run_id: ${{ steps.attestation.outputs.preflight_run_id }}
      release_sha: ${{ steps.resolve-release-sha.outputs.release_sha }}
      release_version: ${{ steps.resolve-release-sha.outputs.release_version }}
    steps:
      - name: Checkout main for release SHA resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current release SHA and version
        id: resolve-release-sha
        run: |
          git fetch --no-tags origin main
          release_sha="$(git rev-parse origin/main)"
          if [ "${GITHUB_SHA}" != "${release_sha}" ]; then
            echo "::error::resolved release SHA does not match the workflow run head SHA"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          release_version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' crates/jose/Cargo.toml | head -n 1)"
          if [ -z "${release_version}" ]; then
            echo "::error::could not derive release version from crates/jose/Cargo.toml"
            exit 1
          fi
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify coordinated release version
        run: node scripts/verify_sdk_release_version.mjs "${{ steps.resolve-release-sha.outputs.release_version }}"

      - name: Require current main and successful crates package checks
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.resolve-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.resolve-release-sha.outputs.release_version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: crates-package-preflight.yml
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: "1"
        run: node scripts/verify_release_attestation.mjs

  dry-run:
    name: crates.io publish preflight
    needs: verify-release-sha
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check crates.io publish order
        run: node scripts/publish_crates_in_order.mjs order
        env:
          RELEASE_VERSION: ${{ needs.verify-release-sha.outputs.release_version }}

      - name: Inspect publishable crate tarballs
        run: node scripts/publish_crates_in_order.mjs inspect
        env:
          CARGO_HOME: ${{ runner.temp }}/package-preflight-cargo-home
          RELEASE_VERSION: ${{ needs.verify-release-sha.outputs.release_version }}

  publish:
    name: Publish reallyme-jose crates
    needs: [verify-release-sha, dry-run]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Revalidate exact approved main commit
        env:
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ] || [ "$(git rev-parse origin/main)" != "${RELEASE_SHA}" ]; then
            echo "::error::approved release SHA changed before publication"
            exit 1
          fi

      - name: Verify attestation and publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-release-sha.outputs.release_version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: crates-package-preflight.yml
          RELEASE_ATTESTATION_PREFLIGHT_RUN_ID: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required"
            exit 1
          fi
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"
          node scripts/verify_release_attestation.mjs
          node scripts/publish_crates_in_order.mjs publish

      - name: Summarize crates.io publication
        env:
          RELEASE_VERSION: ${{ needs.verify-release-sha.outputs.release_version }}
        run: |
          {
            echo '## crates.io publication completed'
            echo
            echo "- [reallyme-jose-proto ${RELEASE_VERSION}](https://crates.io/crates/reallyme-jose-proto/${RELEASE_VERSION})"
            echo "- [reallyme-jose ${RELEASE_VERSION}](https://crates.io/crates/reallyme-jose/${RELEASE_VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

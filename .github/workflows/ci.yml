# Generated by release-readiness --render-ci from .github/release-readiness.json.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Identify CI lanes
    if: ${{ github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/release-readiness.json
          sparse-checkout-cone-mode: false
      - name: Plan checks
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          LANE_PATHS: '{"policy":[],"code":["crates/","deny.toml","packages/ts/","tools/","vectors/"],"proto":["crates/","gen/","packages/","vectors/"],"fuzz":["crates/","fuzz/","vectors/"],"swift":["Package.resolved","Package.swift","crates/","gen/swift/","packages/swift/","vectors/"],"android":["crates/","gen/java/","gen/kotlin/","packages/kotlin-android/","packages/kotlin/","vectors/"],"conformance":["crates/","gen/java/","gen/kotlin/","packages/kotlin/","vectors/"],"formal":["crates/","scripts/check-formal.sh"]}'
          SHARED_PATHS: '[".github/release-readiness.json",".github/workflows/",".github/actions/",".github/scripts/","scripts/",".cargo/","rust-toolchain.toml","Cargo.toml","Cargo.lock","buf.yaml","buf.gen.yaml","buf.lock","package.json","package-lock.json"]'
          CHECKOUT_ATTRIBUTES: '(?:^|\/)\.gitattributes$'
          FORMAL_BUILD_INPUT: '(?:^|\/)(?:Cargo\.(?:toml|lock)|rust-toolchain(?:\.toml)?|\.cargo\/config(?:\.toml)?)$'
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$(git rev-parse --verify HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::The scope job did not check out the candidate SHA."
            exit 1
          fi
          paths_file=$(mktemp)
          changed_file=$(mktemp)
          trap 'rm -f "$paths_file" "$changed_file"' EXIT
          # A pull request candidate is GitHub's test merge. Its first parent is the
          # exact base it was merged with, and the two-commit checkout already has it.
          if [[ "${EVENT_NAME:-}" == "pull_request" ]]; then
            BASE_SHA=$(git rev-parse --verify --quiet "HEAD^1^{commit}" || true)
          fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" != "$HEAD_SHA" ]] &&
             { git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
               git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"; } &&
             git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" -- >"$paths_file"; then
            # A file name that cannot be represented as a JSON string should never
            # cause a relevant lane to be omitted.
            if ! iconv -f UTF-8 -t UTF-8 "$paths_file" | jq -Rs 'split("\u0000") | map(select(length > 0))' >"$changed_file"; then
              printf '%s\n' null >"$changed_file"
            fi
          else
            echo "::notice::No reliable diff baseline. Running all CI lanes."
            printf '%s\n' null >"$changed_file"
          fi
          lanes=$(jq -cen --argjson rules "$LANE_PATHS" --argjson shared "$SHARED_PATHS" --arg attributes "$CHECKOUT_ATTRIBUTES" --arg formal "$FORMAL_BUILD_INPUT" --slurpfile changes "$changed_file" '
            def includes_path($path):
              any(.[]; . as $rule | if endswith("/") then $path | startswith($rule) else . == $path end);
            $changes[0] as $changed | $rules | with_entries(.key as $lane | .value |= (. as $paths |
              $changed == null or ($paths | length == 0) or any($changed[];
                . as $path | ($shared | includes_path($path)) or ($paths | includes_path($path)) or ($path | test($attributes)) or
                ($lane == "formal" and ($path | test($formal))))))
          ')
          echo "lanes=$lanes" >>"$GITHUB_OUTPUT"

  policy:
    if: ${{ github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    uses: ./.github/workflows/readiness.yml

  code:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).code }}
    uses: ./.github/workflows/rust-ci.yml

  proto:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).proto }}
    uses: ./.github/workflows/protobuf-ci.yml

  fuzz:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).fuzz }}
    uses: ./.github/workflows/fuzz-ci.yml

  swift:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).swift }}
    uses: ./.github/workflows/swift-ci.yml

  android:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).android }}
    uses: ./.github/workflows/android-ci.yml

  conformance:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).conformance }}
    uses: ./.github/workflows/kotlin-ci.yml

  formal:
    needs: scope
    if: ${{ fromJSON(needs.scope.outputs.lanes).formal }}
    uses: ./.github/workflows/formal-verification.yml

  required:
    name: Required CI
    if: ${{ always() && github.repository_owner == 'reallyme' && toJSON(github.event.repository.private) == 'false' && (github.event.repository.visibility == null || github.event.repository.visibility == 'public') }}
    needs: [scope, policy, code, proto, fuzz, swift, android, conformance, formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify planned checks
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.sha }}
          FIXED_PLAN: ''
        run: |
          set -euo pipefail
          if ! jq -er --arg sha "$HEAD_SHA" --arg fixed "$FIXED_PLAN" '
            . as $needs |
            (if $fixed != "" then $fixed else .scope.outputs.lanes end | try fromjson catch null) as $plan |
            if ($sha | test("^[a-f0-9]{40}$") | not) or
               ($fixed == "" and $needs.scope.result != "success") or ($plan | type) != "object" then
              error("CI scope did not produce a valid plan")
            elif ($plan | keys) != ($needs | del(.scope) | keys) or $plan.policy != true then
              error("CI scope did not plan every lane")
            else
              [ $plan | to_entries[] | .key as $lane |
                (if .value == true then "success" elif .value == false then "skipped" else "invalid" end) as $expected |
                $needs[$lane].result as $actual |
                if $expected == "invalid" or $expected != $actual then
                  "\($lane) expected \($expected), got \($actual)"
                elif $expected == "success" and $needs[$lane].outputs.verified_sha != $sha then
                  "\($lane) did not verify the candidate SHA"
                else empty end
              ] | if length == 0 then "Required CI passed" else error(join("; ")) end
            end
          ' <<<"$NEEDS"; then
            echo "::error::A required CI lane failed, was cancelled, or disagreed with the change plan."
            exit 1
          fi

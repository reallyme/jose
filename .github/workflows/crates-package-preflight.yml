name: Crates Package Preflight

run-name: Preflight crates ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit on main
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
        default: '0.5.2'

permissions:
  contents: read

concurrency:
  group: crates-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_AUDIT_VERSION: 0.23.0
  CARGO_CHECK_EXTERNAL_TYPES_VERSION: 0.5.0
  CARGO_DENY_VERSION: 0.22.0
  CARGO_NEXTEST_VERSION: 0.9.152
  CARGO_SEMVER_CHECKS_VERSION: 0.51.0
  EXTERNAL_TYPES_NIGHTLY: nightly-2026-03-20
  WASM_BINDGEN_CLI_VERSION: 0.2.130
  BUFFA_VERSION: 0.1.3
  BUF_VERSION: 1.75.0
  BUF_LINUX_X86_64_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b


jobs:
  verify-source-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install dependency maintenance tools
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0,cargo-outdated@0.19.0
          fallback: none

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release crates preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Check artifact privacy
        id: artifact-privacy-1
        uses: ./.github/actions/check-artifact-privacy
        with:
          path: ${{ runner.temp }}/release-readiness-ci.json

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: ${{ runner.temp }}/release-readiness-ci.json
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 30

  crates-package:
    name: crates.io package preflight
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: buffa-${{ env.BUFFA_VERSION }}

      - name: Install nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          fallback: none

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0

      - name: Install external-type checker
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-check-external-types@0.5.0

      - name: Install external-type checker toolchain
        run: rustup toolchain install "$EXTERNAL_TYPES_NIGHTLY" --profile minimal

      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Checkout Rust semver baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cc7870f049eeef3ab09699797d2fa78b5c17dbcf
          path: .semver-baseline
          persist-credentials: false

      - name: Prepare reproducible Rust semver baseline
        run: node scripts/prepare_semver_baseline.mjs .semver-baseline

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version "$CARGO_SEMVER_CHECKS_VERSION" --locked

      - name: Check public Rust API semver
        run: >-
          cargo semver-checks --workspace --exclude reallyme-jose-ffi
          --baseline-root .semver-baseline

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Verify coordinated release version and tooling
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --test scripts/publish_crates_in_order.test.mjs scripts/release_crate_archives.test.mjs scripts/verify_sdk_release_version.test.mjs
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"

      - name: Install buf
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/buf/bin"
          mkdir -p "$install_dir"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$install_dir/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "$BUF_LINUX_X86_64_SHA256" "$install_dir/buf" \
            | sha256sum --check --strict
          chmod 0755 "$install_dir/buf"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/buf" --version

      - name: Install pinned Buffa generators
        run: |
          cargo install reallyme-protoc-gen-buffa --version "=$BUFFA_VERSION" --locked
          cargo install reallyme-protoc-gen-buffa-packaging --version "=$BUFFA_VERSION" --locked

      - name: Validate and regenerate protobuf artifacts
        run: |
          node scripts/generate-jose-proto.mjs
          node scripts/harden-generated-jose-jvm.mjs --check-idempotent
          node scripts/harden-generated-jose-swift.mjs --check-idempotent
          git diff --exit-code -- crates/proto/proto crates/proto/src gen/swift gen/java gen/kotlin packages/ts/src/proto/generated crates/jose/src/map_failure.rs crates/jose/src/generated_contract crates/ffi/src/generated_contract packages/ts/src/contract-verification.ts packages/ts/src/proto.ts packages/ts/src/proto/contract-values.ts packages/swift/Sources/ReallyMeJOSE/Contract*.swift packages/kotlin/src/main/kotlin/me/really/jose/Contract*.kt
          test -z "$(git status --porcelain -- crates/proto/proto crates/proto/src gen/swift gen/java gen/kotlin packages/ts/src/proto/generated crates/jose/src/map_failure.rs crates/jose/src/generated_contract crates/ffi/src/generated_contract packages/ts/src/contract-verification.ts packages/ts/src/proto.ts packages/ts/src/proto/contract-values.ts packages/swift/Sources/ReallyMeJOSE/Contract*.swift packages/kotlin/src/main/kotlin/me/really/jose/Contract*.kt)"

      - name: Format
        run: cargo fmt --check

      # Clippy invokes rustc for every workspace target and feature below and
      # rejects both compiler and Clippy warnings. A separate warning-only
      # cargo check would invalidate dependency reuse without adding coverage.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check public external-type provenance
        run: scripts/check_public_external_types.sh

      - name: Test all features
        run: cargo nextest run --locked --workspace --all-features

      - name: Test publishable crates in the release profile
        run: >-
          cargo nextest run --release --locked -p reallyme-jose
          -p reallyme-jose-proto --all-features

      - name: Check wasm32 lane
        run: cargo check --locked --workspace --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: Test wasm vector lane
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo test --locked -p reallyme-jose --no-default-features --features wasm
          --target wasm32-unknown-unknown --test jws_vectors --test jwt_vectors
          --test jwe_tests --test panva_vectors --test validate_jwe_epk

      - name: Dependency policy
        run: cargo deny check

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Check release readiness contract
        run: node .release-readiness/scripts/run-consumer-check.mjs --policy-only
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Check release version and publish order
        run: node scripts/publish_crates_in_order.mjs order
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Inspect publishable crate tarballs
        run: node scripts/publish_crates_in_order.mjs inspect
        env:
          CARGO_HOME: ${{ runner.temp }}/package-preflight-cargo-home
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Seal inspected crate archives
        env:
          SOURCE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release_crate_archives.mjs seal target/package/release-inspected build/crate-release "$RELEASE_VERSION" "$SOURCE_SHA"

      - name: Check artifact privacy
        id: artifact-privacy-2
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: crates
          path: build/crate-release

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: build/crate-release
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload inspected crate archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crate-archives-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: build/crate-release
          if-no-files-found: error
          retention-days: 30

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ||
                ! "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'After this preflight succeeds, run this command to dispatch publish with both inputs set.' '' \
              '```sh' "gh workflow run crates-release.yml --repo github.com/$GITHUB_REPOSITORY --ref main -f version=$RELEASE_VERSION -f source_sha=$SOURCE_SHA" '```' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi

name: Swift Package Release

run-name: Publish swift ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from the successful package preflight
        required: true
        type: string
      source_sha:
        description: Full source SHA from this ecosystem's successful package preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swift-package-release-${{ inputs.version }}
  cancel-in-progress: false


jobs:
  verify-release-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
      preflight_run_id: ${{ steps.candidate.outputs.preflight_run_id }}
      package_artifact_ids: ${{ steps.candidate.outputs.package_artifact_ids }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce repository privacy
        uses: ./.github/actions/check-repository-privacy

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release swift publish "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

  swift-verify:
    name: SwiftPM artifact verification
    needs: verify-release-sha
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          persist-credentials: false

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          path: build/swift
          merge-multiple: true
          digest-mismatch: error

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Bind manifest to attested Swift artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          checksum="$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Verify SwiftPM manifest and downloaded artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeJOSEFFI.xcframework.zip build/swift/ReallyMeJOSEFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          node .release-readiness/scripts/run-consumer-check.mjs --release-packages --policy-only

  swift-release:
    name: SwiftPM release tag
    needs: [verify-release-sha, swift-verify]
    runs-on: macos-26
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          fetch-depth: 0

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
          artifact-ids: ${{ needs.verify-release-sha.outputs.package_artifact_ids }}
          github-token: ${{ github.token }}
          path: build/swift
          merge-multiple: true
          digest-mismatch: error

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Bind release manifest to verified Swift artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          checksum="$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"

      - name: Create immutable GitHub release with Swift artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeJOSEFFI.xcframework.zip build/swift/ReallyMeJOSEFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::GitHub release v${RELEASE_VERSION} already exists"
            exit 1
          fi
          if ! git diff --quiet -- . ':(exclude)Package.swift'; then
            echo "::error::Swift release preparation modified files other than Package.swift"
            exit 1
          fi
          tag_target="${RELEASE_SHA}"
          if ! git diff --quiet -- Package.swift; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            release_commit_date="$(git show -s --format=%cI "${RELEASE_SHA}")"
            GIT_AUTHOR_DATE="${release_commit_date}" GIT_COMMITTER_DATE="${release_commit_date}" \
              git commit -m "Bind Swift artifact for v${RELEASE_VERSION}"
            tag_target="$(git rev-parse HEAD)"
          fi
          existing_tag_target="$(git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}" | cut -f1)"
          if [ -n "${existing_tag_target}" ] && [ "${existing_tag_target}" != "${tag_target}" ]; then
            echo "::error::Git tag v${RELEASE_VERSION} already targets a different commit"
            exit 1
          fi
          if [ -z "${existing_tag_target}" ]; then
            git tag "v${RELEASE_VERSION}" "${tag_target}"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi
          gh release create "v${RELEASE_VERSION}" build/swift/ReallyMeJOSEFFI.xcframework.zip --verify-tag --title "ReallyMe JOSE v${RELEASE_VERSION}" --notes-file - <<'RELEASE_NOTES'
          - introduce the V2 protobuf operation contract with explicit field presence and schema-defined operation reasons
          - preserve platform-specific SDK setup errors and expose their schema-defined codes
          - generate Rust protobuf memory cleanup and redaction with ReallyMe Buffa 0.1.3
          - use ReallyMe Codec 0.4.5 for the shared native and WASM runtime
          - use ReallyMe Crypto 0.4.5 for the shared cryptographic operations
          - regenerate SDK bindings and rebuild native binaries together for V2
          RELEASE_NOTES

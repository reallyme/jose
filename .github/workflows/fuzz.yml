name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2
  NIGHTLY_TOOLCHAIN: nightly-2026-09-15
  FUZZ_MAX_TOTAL_TIME_SECONDS: 900

jobs:
  scheduled:
    name: scheduled fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - compact_jwe
          - compact_jwe_ecdh_es
          - parse_jwe_header
          - compact_jws_es256
          - signed_jwt
          - validate_jwt_temporal
          - unsigned_jwt
          - operation_wire
          - operation_response
          - ffi_operation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Verify fuzz lockfile is current
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

      - name: Restore and persist fuzz corpus
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Run time-boxed fuzz target
        run: >-
          cargo +nightly-2026-09-15 fuzz run ${{ matrix.target }} --
          -max_total_time="$FUZZ_MAX_TOTAL_TIME_SECONDS" -rss_limit_mb=4096

      - name: Check artifact privacy
        id: artifact-privacy-5
        if: failure()
        uses: ./.github/actions/check-artifact-privacy
        with:
          path: fuzz/artifacts/${{ matrix.target }}

      - name: Upload crash artifacts
        if: ${{ (failure()) && steps.artifact-privacy-5.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

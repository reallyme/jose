name: Protobuf Checks

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.protobuf.outputs.verified_sha }}

permissions:
  contents: read

env:
  BUFFA_VERSION: 0.1.2
  BUF_VERSION: 1.73.0
  BUF_LINUX_X86_64_SHA256: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
  PROTOBUF_BASELINE_FILE: crates/proto/compatibility/v2.binpb

jobs:
  protobuf:
    name: lint and generated freshness
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.100.0
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: buffa-${{ env.BUFFA_VERSION }}

      - name: Install buf
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/buf/bin"
          mkdir -p "$install_dir"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$install_dir/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "$BUF_LINUX_X86_64_SHA256" "$install_dir/buf" \
            | sha256sum --check --strict
          chmod 0755 "$install_dir/buf"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/buf" --version

      - name: Install pinned Buffa generators
        run: |
          cargo install reallyme-protoc-gen-buffa --version "=$BUFFA_VERSION" --locked
          cargo install reallyme-protoc-gen-buffa-packaging --version "=$BUFFA_VERSION" --locked

      - name: Check protobuf compatibility with the V2 contract
        run: buf breaking --against "$PROTOBUF_BASELINE_FILE"

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 5a7c5b4785a2c47589dca7f18be11ed99d5dd7b8
          path: .release-readiness
          persist-credentials: false

      - name: Check release readiness generated freshness
        run: node .release-readiness/scripts/run-consumer-check.mjs --generated-freshness --policy-only

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

name: Swift CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/swift-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "Package.resolved"
      - "packages/swift/**"
      - "gen/swift/**"
      - "crates/ffi/**"
      - "crates/**"
      - "scripts/build_swift_xcframework.sh"
      - "scripts/swift-xcframework-info.plist"
      - "scripts/verify_swift_release_artifact.mjs"
      - "scripts/verify_swift_release_artifact.test.mjs"
      - "scripts/prepare_swift_binary_manifest.mjs"
      - "scripts/prepare_swift_release_candidate.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/swift-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Package.swift"
      - "Package.resolved"
      - "packages/swift/**"
      - "gen/swift/**"
      - "crates/ffi/**"
      - "crates/**"
      - "scripts/build_swift_xcframework.sh"
      - "scripts/swift-xcframework-info.plist"
      - "scripts/verify_swift_release_artifact.mjs"
      - "scripts/verify_swift_release_artifact.test.mjs"
      - "scripts/prepare_swift_binary_manifest.mjs"
      - "scripts/prepare_swift_release_candidate.sh"

permissions:
  contents: read

jobs:
  swift:
    name: Swift 6.3 runtime and linked XCFramework
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and Apple targets
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Test Swift release tooling
        run: node --test scripts/prepare_swift_binary_manifest.test.mjs scripts/verify_swift_release_artifact.test.mjs

      - name: Build runtime-loaded native library
        run: cargo build --locked -p reallyme-jose-ffi

      - name: Enable source-tree runtime FFI override
        run: touch .reallyme-jose-runtime-ffi

      - name: Test runtime-loaded Swift facade
        run: swift test
        env:
          REALLYME_JOSE_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_jose_ffi.dylib
          REALLYME_JOSE_SWIFTPM_RUNTIME_FFI: "1"

      - name: Build deterministic Swift XCFramework
        run: scripts/build_swift_xcframework.sh

      - name: Bind manifest to CI artifact
        run: >-
          node scripts/prepare_swift_binary_manifest.mjs
          0.3.0
          "$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"

      - name: Verify Swift XCFramework
        run: >-
          node scripts/verify_swift_release_artifact.mjs
          build/swift/ReallyMeJOSEFFI.xcframework.zip
          build/swift/ReallyMeJOSEFFI.xcframework.checksum
          Package.swift 0.3.0

      - name: Bind local SwiftPM binary target
        run: >-
          node scripts/prepare_swift_binary_manifest.mjs
          0.3.0
          "$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          --local-artifact-path build/swift/ReallyMeJOSEFFI.xcframework

      - name: Disable runtime FFI override
        run: |
          rm .reallyme-jose-runtime-ffi
          swift package reset

      - name: Test linked Swift XCFramework
        run: swift test

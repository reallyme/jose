name: Swift CI

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.swift.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  swift:
    name: Swift 6.3 runtime and linked XCFramework
    runs-on: macos-26
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and Apple targets
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Verify coordinated release version
        shell: bash
        run: |
          release_version=$(sed -n 's/^let ffiReleaseVersion = "\([^"]*\)"$/\1/p' Package.swift)
          node scripts/verify_sdk_release_version.mjs "$release_version"
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"

      - name: Test Swift release tooling
        run: node --test scripts/prepare_swift_binary_manifest.test.mjs scripts/verify_swift_release_artifact.test.mjs

      - name: Check generated Swift redaction
        run: node scripts/harden-generated-jose-swift.mjs --check-idempotent

      - name: Build runtime-loaded native library
        run: cargo +1.100.0 build --locked -p reallyme-jose-ffi

      - name: Enable source-tree runtime FFI override
        run: touch .reallyme-jose-runtime-ffi

      - name: Test runtime-loaded Swift facade
        run: swift test
        env:
          REALLYME_JOSE_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_jose_ffi.dylib
          REALLYME_JOSE_SWIFTPM_RUNTIME_FFI: "1"

      - name: Build deterministic Swift XCFramework
        run: scripts/build_swift_xcframework.sh

      - name: Bind manifest to CI artifact
        run: >-
          node scripts/prepare_swift_binary_manifest.mjs
          "${RELEASE_VERSION}"
          "$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"

      - name: Verify Swift XCFramework
        run: >-
          node scripts/verify_swift_release_artifact.mjs
          build/swift/ReallyMeJOSEFFI.xcframework.zip
          build/swift/ReallyMeJOSEFFI.xcframework.checksum
          Package.swift "${RELEASE_VERSION}"

      - name: Bind local SwiftPM binary target
        run: >-
          node scripts/prepare_swift_binary_manifest.mjs
          "${RELEASE_VERSION}"
          "$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          --local-artifact-path build/swift/ReallyMeJOSEFFI.xcframework

      - name: Disable runtime FFI override
        run: |
          rm .reallyme-jose-runtime-ffi
          swift package reset

      - name: Test linked Swift XCFramework
        run: swift test

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

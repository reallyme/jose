name: Release Readiness

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.readiness.outputs.verified_sha }}

permissions:
  contents: read

env:
  WASM_BINDGEN_CLI_VERSION: 0.2.130
  WASM_PACK_VERSION: 0.15.1

jobs:
  readiness:
    name: release readiness contract
    runs-on: macos-26
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce repository privacy
        uses: ./.github/actions/check-repository-privacy

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install wasm-pack
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Install TypeScript package dependencies
        run: npm ci --prefix packages/ts

      - name: Audit npm dependency locks
        run: |
          npm audit --prefix packages/ts
          npm audit --prefix tools/panva-goldens

      - name: Test JVM advisory validation
        run: python3 -m unittest discover -s scripts -p 'test_jvm_advisories.py'

      - name: Audit JVM dependency locks
        run: python3 scripts/check_jvm_advisories.py

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Run release readiness checks
        run: node .release-readiness/scripts/run-consumer-check.mjs

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

name: Kotlin Android Package Preflight
run-name: Preflight maven ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit on main
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
        default: '0.7.0'

permissions:
  contents: read

concurrency:
  group: kotlin-android-package-preflight-${{ inputs.version }}
  cancel-in-progress: false


jobs:
  verify-source-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
      ci_run_id: ${{ steps.candidate.outputs.ci_run_id }}
      android_artifact_id: ${{ steps.candidate.outputs.android_artifact_id }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install dependency maintenance tools
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: Install pinned dependency update checker
        # The current installer catalog does not yet include this release.
        run: cargo +1.100.0 install cargo-outdated --version '=0.19.0' --locked

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release maven preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Check artifact privacy
        id: artifact-privacy-10
        uses: ./.github/actions/check-artifact-privacy
        with:
          path: ${{ runner.temp }}/release-readiness-ci.json

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: ${{ runner.temp }}/release-readiness-ci.json
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 30

  jvm-native:
    name: jvm native preflight ${{ matrix.platform }}
    needs: verify-source-sha
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: macos-15, platform: macos-aarch64 }
          - { os: windows-2025, platform: windows-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'
      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false
      - name: Build host JNI resource
        shell: bash
        run: scripts/build_kotlin_native_resource.sh build/kotlin-native-resources
      - id: digest
        name: Record producer digest outside artifact
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: >-
          node scripts/verify_native_artifact_handoff.mjs record
          build/kotlin-native-resources build/kotlin-native-digests "${NATIVE_PLATFORM}"
      - name: Check artifact privacy
        id: artifact-privacy-11
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: native
          path: build/kotlin-native-resources

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: build/kotlin-native-resources
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload native JNI resource
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-native-${{ matrix.platform }}
          path: build/kotlin-native-resources
          if-no-files-found: error
          retention-days: 30
      - name: Check artifact privacy
        id: artifact-privacy-12
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: native
          path: build/kotlin-native-digests

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: build/kotlin-native-digests
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload native JNI digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-digest-${{ matrix.platform }}
          path: build/kotlin-native-digests
          if-no-files-found: error
          retention-days: 30

  package-artifacts:
    name: JVM and Android package preflight
    needs: [verify-source-sha, jvm-native]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-native-*
          path: build/kotlin-native-resources
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-digest-*
          path: build/kotlin-native-digests
          merge-multiple: true
      - name: Verify cross-run native handoff
        run: >-
          node scripts/verify_native_artifact_handoff.mjs verify
          build/kotlin-native-resources build/kotlin-native-digests
      - name: Write JVM native integrity manifest
        run: node scripts/write_native_manifest.mjs build/kotlin-native-resources/me/really/jose/native build/kotlin-native-resources/me/really/jose/native/native-manifest.json
      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Download tested Android publication
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.verify-source-sha.outputs.android_artifact_id }}
          run-id: ${{ needs.verify-source-sha.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/android-publication
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and stage tested Android publication
        env:
          SOURCE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          repository="$RUNNER_TEMP/android-publication/repository"
          node .release-readiness/scripts/android-runtime.mjs verify-publication "$repository" "$SOURCE_SHA" "$RELEASE_VERSION"
          mkdir -p build/maven-release
          cp -R "$repository/." build/maven-release/
      - name: Test and stage JVM publication
        run: >-
          packages/kotlin/gradlew --dependency-verification strict -p packages/kotlin
          test verifyJarContainsNativeResources publishMavenPublicationToLocalReleaseRepository
          -Preallyme.jose.nativeResourcesDir=${{ github.workspace }}/build/kotlin-native-resources
          -Preallyme.jose.requireFullNativeResources=true
          -Preallyme.maven.localReleaseRepositoryDir=${{ github.workspace }}/build/maven-release
      - name: Verify staged Maven repository
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"
          node --test scripts/promote_maven_release_repository.test.mjs scripts/verify_native_artifact_handoff.test.mjs scripts/verify_sdk_release_version.test.mjs
          node scripts/verify_maven_release_repository.mjs build/maven-release "${RELEASE_VERSION}"
          node .release-readiness/scripts/run-consumer-check.mjs --policy-only
      - name: Check artifact privacy
        id: artifact-privacy-13
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: maven
          path: build/maven-release

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: build/maven-release
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload Maven publications
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-publications-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: build/maven-release
          if-no-files-found: error
          retention-days: 30

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ||
                ! "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'After this preflight succeeds, run this command to dispatch publish with both inputs set.' '' \
              '```sh' "gh workflow run kotlin-android-package-release.yml --repo github.com/$GITHUB_REPOSITORY --ref main -f version=$RELEASE_VERSION -f source_sha=$SOURCE_SHA" '```' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi

name: Android CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-ci.yml"
      - "packages/kotlin-android/**"
      - "packages/kotlin/**"
      - "gen/java/**"
      - "gen/kotlin/**"
      - "crates/ffi/**"
      - "scripts/build_android_native_resources.sh"
      - "scripts/test_android_consumer_r8_runtime.sh"
      - "scripts/write_native_manifest.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-ci.yml"
      - "packages/kotlin-android/**"
      - "packages/kotlin/**"
      - "gen/java/**"
      - "gen/kotlin/**"
      - "crates/ffi/**"
      - "scripts/build_android_native_resources.sh"
      - "scripts/test_android_consumer_r8_runtime.sh"
      - "scripts/write_native_manifest.mjs"

permissions:
  contents: read

jobs:
  android-release-runtime:
    name: Android AAR and minified runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned Android NDK
        run: |
          { yes 2>/dev/null || true; } | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "${GITHUB_ENV}"
      - name: Verify native manifest writer
        run: node --test scripts/write_native_manifest.test.mjs
      - name: Enable emulator KVM
        run: |
          test -e /dev/kvm
          sudo chown "${USER}:${USER}" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Test minified Android consumer runtime
        run: scripts/test_android_consumer_r8_runtime.sh
        env:
          REALLYME_JOSE_ANDROID_AVD: reallyme-jose-r8-gate

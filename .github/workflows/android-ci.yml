name: Android runtime

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.runtime.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  runtime:
    name: Minified Android consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      verified_sha: ${{ steps.runtime.outputs.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout release-readiness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Restore Gradle cache
        # Ignored files remain local; remote build caches are disabled.
        if: false
        id: android-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-runtime-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'scripts/prepare-android-runtime.sh') }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - name: Install pinned Android NDK
        run: |
          # Older runner tools misparse API 37.0 and write target=android-0.
          { yes 2>/dev/null || true; } | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;23.0"
          grep -Fxq 'Pkg.Revision=23.0' "${ANDROID_HOME}/cmdline-tools/23.0/source.properties"
          { yes 2>/dev/null || true; } | "${ANDROID_HOME}/cmdline-tools/23.0/bin/android" --sdk="${ANDROID_HOME}" --no-metrics sdk install "ndk/30.0.16248370"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "${GITHUB_ENV}"
      - name: Verify native manifest writer
        run: node --test scripts/write_native_manifest.test.mjs

      - name: Enable emulator acceleration
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Stage Android Maven publication
        shell: bash
        env:
          MAVEN_REPOSITORY: ${{ runner.temp }}/android-publication/repository
        run: |
          # Package once. The consumer resolves this publication by its Maven
          # coordinates so the test covers the same AAR that preflight uses.
          mkdir -p "$MAVEN_REPOSITORY"
          bash -e -o pipefail scripts/stage-android-publication.sh "$MAVEN_REPOSITORY"
          node .release-readiness/scripts/android-runtime.mjs seal-publication "$MAVEN_REPOSITORY" "$GITHUB_SHA"

      - name: Prepare Android consumer and emulator
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
          ANDROID_AVD_NAME: reallyme-runtime
          ANDROID_AVD_DEVICE: pixel
          APK_PATH: ${{ runner.temp }}/android-runtime.apk
          MAVEN_REPOSITORY: ${{ runner.temp }}/android-publication/repository
        run: |
          bash -e -o pipefail scripts/prepare-android-runtime.sh "$APK_PATH" "$ANDROID_AVD_NAME" "$MAVEN_REPOSITORY"
          test -s "$APK_PATH"

      - name: Test minified Android consumer runtime
        id: runtime
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
          ANDROID_AVD_NAME: reallyme-runtime
          ANDROID_SERIAL: emulator-5554
          APK_PATH: ${{ runner.temp }}/android-runtime.apk
          MAVEN_REPOSITORY: ${{ runner.temp }}/android-publication/repository
        run: bash -e -o pipefail scripts/run-android-emulator.sh

      # Release qualification accepts a main run or, with a merge queue, the
      # queue run that main fast-forwarded to. PR runs never qualify.
      - name: Check artifact privacy
        id: artifact-privacy-3
        if: >-
          (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
          (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: maven
          path: ${{ runner.temp }}/android-publication/

      - name: Upload tested Android publication
        if: ${{ ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && steps.artifact-privacy-3.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-maven-${{ github.sha }}
          path: ${{ runner.temp }}/android-publication/
          if-no-files-found: error
          overwrite: true

      - name: Save Gradle cache
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.android-cache.outputs.cache-primary-key }}

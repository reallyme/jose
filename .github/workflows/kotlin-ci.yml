name: Kotlin JVM CI

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verify.outputs.verified_sha }}

permissions:
  contents: read

jobs:
  kotlin-jvm:
    name: Kotlin JVM ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'
      - name: Verify generated JVM hardening
        shell: bash
        run: node scripts/harden-generated-jose-jvm.mjs --check-idempotent
      - name: Test typed JVM facade and native JAR
        shell: bash
        run: packages/kotlin/gradlew -p packages/kotlin --no-daemon test verifyJarContainsNativeResources

  verify:
    name: Verify all JVM targets
    needs: kotlin-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

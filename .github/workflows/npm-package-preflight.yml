name: npm Package Preflight
run-name: Preflight npm ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit on main
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.5.0

permissions:
  contents: read

concurrency:
  group: npm-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

env:
  WASM_BINDGEN_CLI_VERSION: 0.2.130
  WASM_PACK_VERSION: 0.15.1


jobs:
  verify-source-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.100.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 7dffa0366a43fe9cc7b98a8040d37dd701d7955e
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release npm preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 30

  npm-package:
    name: npm package preflight
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}
      - name: Install TypeScript dependencies
        run: npm ci --prefix packages/ts
      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 7dffa0366a43fe9cc7b98a8040d37dd701d7955e
          path: .release-readiness
          persist-credentials: false
      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --release-packages --policy-only
      - name: Test TypeScript package and WASM provider
        run: npm --prefix packages/ts test
      - name: Verify npm tarball and WASM surface
        run: npm --prefix packages/ts run pack:check
      - name: Build immutable npm tarball
        working-directory: packages/ts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ../../build/npm
          npm pack --ignore-scripts --pack-destination ../../build/npm
          artifact="../../build/npm/reallyme-jose-${RELEASE_VERSION}.tgz"
          if [ ! -f "${artifact}" ]; then
            echo "::error::npm did not create the expected tarball"
            exit 1
          fi
          cd ../../build/npm
          sha256sum "reallyme-jose-${RELEASE_VERSION}.tgz" > "reallyme-jose-${RELEASE_VERSION}.tgz.sha256"
      - name: Upload immutable npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-jose-npm-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: |
            build/npm/reallyme-jose-${{ inputs.version }}.tgz
            build/npm/reallyme-jose-${{ inputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30

name: npm Package Preflight
run-name: Preflight npm ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit on main
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
        default: '0.7.0'

permissions:
  contents: read

concurrency:
  group: npm-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

env:
  WASM_BINDGEN_CLI_VERSION: 0.2.130
  WASM_PACK_VERSION: 0.15.1


jobs:
  verify-source-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install dependency maintenance tools
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: Install pinned dependency update checker
        # The current installer catalog does not yet include this release.
        run: cargo +1.100.0 install cargo-outdated --version '=0.20.0' --locked

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release npm preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Check artifact privacy
        id: artifact-privacy-8
        uses: ./.github/actions/check-artifact-privacy
        with:
          path: ${{ runner.temp }}/release-readiness-ci.json

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: ${{ runner.temp }}/release-readiness-ci.json
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 30

  npm-package:
    name: npm package preflight
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}
      - name: Install TypeScript dependencies
        run: npm ci --prefix packages/ts
      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false
      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --release-packages --policy-only
      - name: Test TypeScript package and WASM provider
        run: npm --prefix packages/ts test
      - name: Verify npm tarball and WASM surface
        run: npm --prefix packages/ts run pack:check
      - name: Build immutable npm tarball
        working-directory: packages/ts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ../../build/npm
          npm pack --ignore-scripts --pack-destination ../../build/npm
          artifact="../../build/npm/reallyme-jose-${RELEASE_VERSION}.tgz"
          if [ ! -f "${artifact}" ]; then
            echo "::error::npm did not create the expected tarball"
            exit 1
          fi
          cd ../../build/npm
          sha256sum "reallyme-jose-${RELEASE_VERSION}.tgz" > "reallyme-jose-${RELEASE_VERSION}.tgz.sha256"
      - name: Check artifact privacy
        id: artifact-privacy-9
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: npm
          path: |
            build/npm/reallyme-jose-${{ inputs.version }}.tgz
            build/npm/reallyme-jose-${{ inputs.version }}.tgz.sha256

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: |
            build/npm/reallyme-jose-${{ inputs.version }}.tgz
            build/npm/reallyme-jose-${{ inputs.version }}.tgz.sha256
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload immutable npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reallyme-jose-npm-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: |
            build/npm/reallyme-jose-${{ inputs.version }}.tgz
            build/npm/reallyme-jose-${{ inputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ||
                ! "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'After this preflight succeeds, run this command to dispatch publish with both inputs set.' '' \
              '```sh' "gh workflow run npm-package-release.yml --repo github.com/$GITHUB_REPOSITORY --ref main -f version=$RELEASE_VERSION -f source_sha=$SOURCE_SHA" '```' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi

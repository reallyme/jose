name: Kotlin Android Package Release

run-name: Kotlin Android package release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.3.0

permissions:
  contents: read

concurrency:
  group: kotlin-android-package-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      preflight_run_id: ${{ steps.attestation.outputs.preflight_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Resolve current release SHA
        run: |
          git fetch --no-tags origin main
          release_sha="$(git rev-parse origin/main)"
          if [ "${GITHUB_SHA}" != "${release_sha}" ]; then
            echo "::error::resolved release SHA does not match the workflow run head SHA"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: attestation
        name: Require current main and successful Kotlin Android package checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.resolve.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: kotlin-android-package-preflight.yml
          RELEASE_ATTESTATION_WAIT_SECONDS: "3600"
          RELEASE_ATTESTATION_POLL_SECONDS: "20"
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: "1"
        run: |
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"
          node scripts/verify_release_attestation.mjs

  publish-maven:
    name: Promote signed JVM and Android packages
    needs: verify-release-sha
    runs-on: ubuntu-24.04
    environment: maven-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Download attested Maven publication repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-publications-${{ inputs.version }}-${{ needs.verify-release-sha.outputs.release_sha }}
          path: build/maven-release
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
      - name: Revalidate exact approved main commit
        env:
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "${RELEASE_SHA}" ] || [ "$(git rev-parse origin/main)" != "${RELEASE_SHA}" ]; then
            echo "::error::approved release SHA changed before Maven publication"
            exit 1
          fi
      - name: Verify attestation and exact staged package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ATTESTATION_PREFLIGHT_WORKFLOW: kotlin-android-package-preflight.yml
          RELEASE_ATTESTATION_PREFLIGHT_RUN_ID: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
        run: |
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"
          node scripts/verify_release_attestation.mjs
          node scripts/verify_maven_release_repository.mjs build/maven-release "${RELEASE_VERSION}"
      - name: Sign attested Maven publication bytes
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/sign_maven_release_repository.mjs build/maven-release "${RELEASE_VERSION}"
      - name: Promote both packages and verify remote bytes
        env:
          REALLYME_MAVEN_REPOSITORY_URL: ${{ secrets.REALLYME_MAVEN_REPOSITORY_URL }}
          REALLYME_MAVEN_USERNAME: ${{ secrets.REALLYME_MAVEN_USERNAME }}
          REALLYME_MAVEN_PASSWORD: ${{ secrets.REALLYME_MAVEN_PASSWORD }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_maven_release_repository.mjs build/maven-release "${RELEASE_VERSION}"
          node scripts/promote_maven_release_repository.mjs build/maven-release "${RELEASE_VERSION}"

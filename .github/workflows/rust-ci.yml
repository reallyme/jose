name: Rust CI

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.verify.outputs.verified_sha }}

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: 0.23.0
  CARGO_CHECK_EXTERNAL_TYPES_VERSION: 0.5.0
  CARGO_NEXTEST_VERSION: 0.9.152
  EXTERNAL_TYPES_NIGHTLY: nightly-2026-03-20
  WASM_BINDGEN_CLI_VERSION: 0.2.130
  WASM_PACK_VERSION: 0.15.1

jobs:
  msrv:
    name: MSRV 1.100
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test JOSE at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-jose --all-features

      - name: Test JOSE protobuf at its declared MSRV
        run: cargo +1.100.0 test --locked --package reallyme-jose-proto --all-features

  rust:
    name: fmt, lint, test, audit, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install pinned sanitizer toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-09-15

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152

      - name: Install cargo-deny
        run: cargo +1.100.0 install cargo-deny --version '=0.22.0' --locked --force

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0

      - name: Install external-type checker
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-check-external-types@0.5.0

      - name: Install external-type checker toolchain
        run: rustup toolchain install "$EXTERNAL_TYPES_NIGHTLY" --profile minimal

      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Format
        run: cargo fmt --check

      - name: Check all features
        run: cargo check --locked --workspace --all-features

      - name: Check unwind-capable FFI release profile
        run: cargo check --locked -p reallyme-jose-ffi --profile release-ffi

      - name: Check warnings as errors
        run: RUSTFLAGS=-Dwarnings cargo check --locked --workspace --all-features

      - name: Check no-feature guidance
        shell: bash
        run: |
          set +e
          output="$(cargo check --locked -p reallyme-jose --no-default-features 2>&1)"
          status="$?"
          set -e
          test "$status" -ne 0
          grep -F "reallyme-jose requires a supported runtime lane" <<< "$output"

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check public external-type provenance
        run: scripts/check_public_external_types.sh

      - name: Format vector audit tool
        run: cargo fmt --manifest-path tools/vector-audit/Cargo.toml --check

      - name: Clippy vector audit tool
        run: >-
          cargo clippy --locked --manifest-path tools/vector-audit/Cargo.toml
          --all-targets -- -D warnings

      - name: Test native lane
        run: cargo nextest run --locked --workspace --no-default-features --features native

      - name: Test on the release toolchain
        run: cargo +1.100.0 test --locked --workspace --all-features

      # The workspace release profile intentionally aborts, while the FFI
      # boundary requires release-ffi/unwind. Exercise only publishable Rust
      # crates here; the FFI artifact has its dedicated release-profile gate.
      - name: Test publishable crates in the release profile
        run: >-
          cargo nextest run --release --locked -p reallyme-jose
          -p reallyme-jose-proto --all-features

      - name: Independent vector audit
        run: >-
          cargo run --locked --manifest-path tools/vector-audit/Cargo.toml
          --bin reallyme-jose-vector-audit -- .

      - name: Doc build
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install TypeScript package dependencies
        run: npm ci --prefix packages/ts

      - name: Test TypeScript package and WASM provider
        run: npm --prefix packages/ts test

      - name: Verify npm tarball and WASM surface
        run: npm --prefix packages/ts run pack:check

      - name: Check native lane
        run: cargo check --locked --workspace --no-default-features --features native

      # Workspace feature unification can enable wasm in the native job.
      # Compile and test JOSE alone to keep its native-only cfg paths live.
      - name: Check native-only JOSE lanes
        run: |
          cargo check --locked -p reallyme-jose --no-default-features --features native
          cargo clippy --locked -p reallyme-jose --all-targets --no-default-features --features native,wire -- -D warnings
          cargo nextest run --locked -p reallyme-jose --no-default-features --features native,wire

      - name: Check wasm32 lane
        run: cargo check --locked --workspace --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: Test wasm vector lane
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo test --locked -p reallyme-jose --no-default-features --features wasm
          --target wasm32-unknown-unknown --test jws_vectors --test jwt_vectors
          --test jwe_tests --test panva_vectors --test validate_jwe_epk

      - name: Native ABI release artifact
        run: scripts/test_ffi_abi_release_artifact.sh

      - name: Native boundary sanitizers
        run: scripts/test_native_sanitizers.sh

      - name: Check locked dependencies
        run: cargo +1.100.0 deny --locked --workspace --all-features --config deny.toml check advisories licenses sources

      - name: Check dependency bans
        run: cargo +1.100.0 deny --locked --workspace --all-features --config deny.toml check bans

      - name: Security advisory audit
        run: scripts/audit_committed_lockfiles.sh

      - name: Crates.io package preflight
        run: node scripts/publish_crates_in_order.mjs inspect
        env:
          CARGO_HOME: ${{ runner.temp }}/package-preflight-cargo-home


  verify:
    name: Verify Rust, WASM and TypeScript
    needs: [msrv, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

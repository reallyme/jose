name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/renovate.json"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/renovate.json"

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_CHECK_EXTERNAL_TYPES_VERSION: 0.5.0
  CARGO_DENY_VERSION: 0.20.2
  CARGO_NEXTEST_VERSION: 0.9.140
  EXTERNAL_TYPES_NIGHTLY: nightly-2026-03-20
  WASM_BINDGEN_CLI_VERSION: 0.2.126
  WASM_PACK_VERSION: 0.15.0

jobs:
  rust:
    name: fmt, lint, test, audit, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install pinned sanitizer toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-07-01

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Install external-type checker
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-check-external-types@${{ env.CARGO_CHECK_EXTERNAL_TYPES_VERSION }}

      - name: Install external-type checker toolchain
        run: rustup toolchain install "$EXTERNAL_TYPES_NIGHTLY" --profile minimal

      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/ts/package-lock.json

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Format
        run: cargo fmt --check

      - name: Check all features
        run: cargo check --locked --workspace --all-features

      - name: Check unwind-capable FFI release profile
        run: cargo check --locked -p reallyme-jose-ffi --profile release-ffi

      - name: Check warnings as errors
        run: RUSTFLAGS=-Dwarnings cargo check --locked --workspace --all-features

      - name: Check no-feature guidance
        shell: bash
        run: |
          set +e
          output="$(cargo check --locked -p reallyme-jose --no-default-features 2>&1)"
          status="$?"
          set -e
          test "$status" -ne 0
          grep -F "reallyme-jose requires a supported runtime lane" <<< "$output"

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check public external-type provenance
        run: >-
          cargo +"${EXTERNAL_TYPES_NIGHTLY}" check-external-types
          --manifest-path crates/jose/Cargo.toml --all-features

      - name: Format vector audit tool
        run: cargo fmt --manifest-path tools/vector-audit/Cargo.toml --check

      - name: Clippy vector audit tool
        run: >-
          cargo clippy --locked --manifest-path tools/vector-audit/Cargo.toml
          --all-targets -- -D warnings

      - name: Test native lane
        run: cargo nextest run --locked --workspace --no-default-features --features native

      - name: Test all features
        run: cargo nextest run --locked --workspace --all-features

      # The workspace release profile intentionally aborts, while the FFI
      # boundary requires release-ffi/unwind. Exercise only publishable Rust
      # crates here; the FFI artifact has its dedicated release-profile gate.
      - name: Test publishable crates in the release profile
        run: >-
          cargo nextest run --release --locked -p reallyme-jose
          -p reallyme-jose-proto --all-features

      - name: Independent vector audit
        run: >-
          cargo run --locked --manifest-path tools/vector-audit/Cargo.toml
          --bin reallyme-jose-vector-audit -- .

      - name: Doc build
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc

      - name: Install TypeScript package dependencies
        run: npm ci --prefix packages/ts

      - name: Test TypeScript package and WASM provider
        run: npm --prefix packages/ts test

      - name: Verify npm tarball and WASM surface
        run: npm --prefix packages/ts run pack:check

      - name: Check native lane
        run: cargo check --locked --workspace --no-default-features --features native

      - name: Check wasm32 lane
        run: cargo check --locked --workspace --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: Test wasm vector lane
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo test --locked -p reallyme-jose --no-default-features --features wasm
          --target wasm32-unknown-unknown --test jws_vectors --test jwt_vectors
          --test jwe_tests --test panva_vectors --test validate_jwe_epk

      - name: Native ABI release artifact
        run: scripts/test_ffi_abi_release_artifact.sh

      - name: Native boundary sanitizers
        run: scripts/test_native_sanitizers.sh

      - name: Dependency policy
        run: cargo deny check

      - name: Security advisory audit
        run: cargo audit --deny warnings

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: f27973caf9d3a12847cac4032c361f5f553c97e9
          path: .release-readiness
          persist-credentials: false

      - name: Release readiness
        run: node .release-readiness/scripts/run-consumer-check.mjs --policy-only

      - name: Crates.io package preflight
        run: node scripts/publish_crates_in_order.mjs inspect
        env:
          CARGO_HOME: ${{ runner.temp }}/package-preflight-cargo-home

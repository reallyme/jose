name: Fuzz smoke tests

on:
  workflow_call:
    outputs:
      verified_sha:
        value: ${{ jobs.build.outputs.verified_sha }}

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2
  NIGHTLY_TOOLCHAIN: nightly-2026-09-15

jobs:
  build:
    name: fuzz target build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified_sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Cache Cargo
        # Ignored files remain local; remote build caches are disabled.
        if: false
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Verify fuzz lockfile is current
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

      - name: Build fuzz targets
        run: cargo +nightly-2026-09-15 fuzz build

      - name: Exercise the checked-in seed corpora
        shell: bash
        run: |
          targets="$(cargo +nightly-2026-09-15 fuzz list)"
          test -n "$targets"
          while IFS= read -r target; do
            cargo +nightly-2026-09-15 fuzz run "$target" -- -runs=32 -max_total_time=15 -rss_limit_mb=4096
          done <<< "$targets"

      - name: Verify fuzz build did not rewrite the lockfile
        run: git diff --exit-code -- fuzz/Cargo.lock

      - name: Record verified source
        id: verified
        shell: bash
        run: |
          sha=$(git rev-parse --verify HEAD)
          test "$sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

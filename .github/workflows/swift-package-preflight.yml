name: Swift Package Preflight
run-name: Swift package preflight ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional exact main commit SHA to certify. Leave blank to use current origin/main.
        required: false
        type: string
        default: ""
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.3.0

permissions:
  contents: read

concurrency:
  group: swift-package-preflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: verify source SHA
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Resolve release SHA
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          git fetch --no-tags origin main
          if [ -n "${RELEASE_SHA_INPUT}" ]; then
            if [[ ! "${RELEASE_SHA_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release_sha must be blank or a lowercase 40-character commit SHA"
              exit 1
            fi
            release_sha="${RELEASE_SHA_INPUT}"
          else
            release_sha="$(git rev-parse origin/main)"
          fi
          if [ "$(git rev-parse origin/main)" != "${release_sha}" ]; then
            echo "::error::resolved release SHA is not the current origin/main tip"
            exit 1
          fi
          if [ "${GITHUB_SHA}" != "${release_sha}" ]; then
            echo "::error::resolved release SHA does not match the workflow run head SHA"
            exit 1
          fi
          git checkout --detach "${release_sha}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

  swift-package:
    name: swift package preflight
    needs: verify-source-sha
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version
      - name: Build JOSE FFI dylib
        run: cargo build --locked -p reallyme-jose-ffi
      - name: Enable source-tree Swift runtime FFI
        run: touch .reallyme-jose-runtime-ffi
      - name: Test Swift package through runtime FFI
        run: swift test
        env:
          REALLYME_JOSE_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_jose_ffi.dylib
          REALLYME_JOSE_SWIFTPM_RUNTIME_FFI: "1"
      - name: Build SwiftPM binary artifact
        run: scripts/build_swift_xcframework.sh

      # Preserve the exact tested candidate before Package.swift is rewritten.
      # The credentialed release job promotes these bytes without rebuilding.
      - name: Upload Swift release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-xcframework-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: |
            build/swift/ReallyMeJOSEFFI.xcframework.zip
            build/swift/ReallyMeJOSEFFI.xcframework.checksum
          if-no-files-found: error
          retention-days: 7
      - name: Test Swift release tooling
        run: node --test scripts/prepare_swift_binary_manifest.test.mjs scripts/verify_swift_release_artifact.test.mjs scripts/verify_release_attestation.test.mjs scripts/verify_sdk_release_version.test.mjs
      - name: Bind manifest to Swift release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          checksum="$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
      - name: Verify generated SwiftPM manifest and release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeJOSEFFI.xcframework.zip build/swift/ReallyMeJOSEFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          node scripts/run_pinned_release_readiness.mjs --release-packages
      - name: Prepare local SwiftPM binary manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          checksum="$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}" --local-artifact-path build/swift/ReallyMeJOSEFFI.xcframework
      - name: Reset SwiftPM package state
        run: |
          rm .reallyme-jose-runtime-ffi
          swift package reset
      - name: Test Swift package with linked binary target
        run: swift test

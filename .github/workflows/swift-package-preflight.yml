name: Swift Package Preflight
run-name: Preflight swift ${{ inputs.version }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit on main
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
        default: '0.7.0'

permissions:
  contents: read

concurrency:
  group: swift-package-preflight-${{ inputs.version }}
  cancel-in-progress: false


jobs:
  verify-source-sha:
    name: Verify release source and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ inputs.source_sha }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Install dependency maintenance tools
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: Install pinned dependency update checker
        # The current installer catalog does not yet include this release.
        run: cargo +1.100.0 install cargo-outdated --version '=0.19.0' --locked

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false

      - name: Verify coordinated release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify_sdk_release_version.mjs "$RELEASE_VERSION"

      - name: Verify release candidate
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: v${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .release-readiness/scripts/run-consumer-check.mjs --check-release swift preflight "$RELEASE_VERSION" "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Check artifact privacy
        id: artifact-privacy-6
        uses: ./.github/actions/check-artifact-privacy
        with:
          path: ${{ runner.temp }}/release-readiness-ci.json

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: ${{ runner.temp }}/release-readiness-ci.json
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Record verified CI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-readiness-ci-${{ github.run_attempt }}-${{ steps.candidate.outputs.ci_run_id }}
          path: ${{ runner.temp }}/release-readiness-ci.json
          if-no-files-found: error
          retention-days: 30

  swift-package:
    name: swift package preflight
    needs: verify-source-sha
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '26'
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version
      - name: Build JOSE FFI dylib
        run: cargo +1.100.0 build --locked -p reallyme-jose-ffi
      - name: Enable source-tree Swift runtime FFI
        run: touch .reallyme-jose-runtime-ffi
      - name: Test Swift package through runtime FFI
        run: swift test
        env:
          REALLYME_JOSE_FFI_LIBRARY_PATH: ${{ github.workspace }}/target/debug/libreallyme_jose_ffi.dylib
          REALLYME_JOSE_SWIFTPM_RUNTIME_FFI: "1"
      - name: Build SwiftPM binary artifact
        run: scripts/build_swift_xcframework.sh

      # Preserve the exact tested candidate before Package.swift is rewritten.
      # The credentialed release job promotes these bytes without rebuilding.
      - name: Test Swift release tooling
        run: node --test scripts/prepare_swift_binary_manifest.test.mjs scripts/verify_swift_release_artifact.test.mjs scripts/verify_sdk_release_version.test.mjs
      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 16aab5287de498e858ff3b85d9e66d7c9f7ebb74
          path: .release-readiness
          persist-credentials: false
      - name: Bind manifest to Swift release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          checksum="$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}"
      - name: Verify generated SwiftPM manifest and release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_swift_release_artifact.mjs build/swift/ReallyMeJOSEFFI.xcframework.zip build/swift/ReallyMeJOSEFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          node .release-readiness/scripts/run-consumer-check.mjs --release-packages --policy-only
      - name: Prepare local SwiftPM binary manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          checksum="$(cat build/swift/ReallyMeJOSEFFI.xcframework.checksum)"
          node scripts/prepare_swift_binary_manifest.mjs "${RELEASE_VERSION}" "${checksum}" --local-artifact-path build/swift/ReallyMeJOSEFFI.xcframework
      - name: Reset SwiftPM package state
        run: |
          rm .reallyme-jose-runtime-ffi
          swift package reset
      - name: Test Swift package with linked binary target
        run: swift test

      - name: Check artifact privacy
        id: artifact-privacy-7
        uses: ./.github/actions/check-artifact-privacy
        with:
          release-payload: swift
          path: |
            build/swift/ReallyMeJOSEFFI.xcframework.zip
            build/swift/ReallyMeJOSEFFI.xcframework.checksum

      - name: Verify publication privacy
        shell: bash
        env:
          PUBLICATION_PATH: |
            build/swift/ReallyMeJOSEFFI.xcframework.zip
            build/swift/ReallyMeJOSEFFI.xcframework.checksum
        run: node .release-readiness/scripts/repository-privacy.mjs --artifact "$PUBLICATION_PATH"

      - name: Upload Swift release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-xcframework-${{ inputs.version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: |
            build/swift/ReallyMeJOSEFFI.xcframework.zip
            build/swift/ReallyMeJOSEFFI.xcframework.checksum
          if-no-files-found: error
          retention-days: 30

      - name: Show release form inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          SHA_PATTERN: '^[0-9a-f]{40}$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$SOURCE_SHA" != "$GITHUB_SHA" || ! "$SOURCE_SHA" =~ $SHA_PATTERN ||
                ! "$RELEASE_VERSION" =~ $VERSION_PATTERN ||
                ! "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::warning::Cannot show release inputs without a matching preflight dispatch on main." >&2
            exit 0
          fi
          if [[ -z "$GITHUB_STEP_SUMMARY" ]]; then
            echo "::warning::GitHub Actions did not provide a job summary file." >&2
            exit 0
          fi
          if ! printf '%s\n' '## Release form inputs' '' \
              'After this preflight succeeds, run this command to dispatch publish with both inputs set.' '' \
              '```sh' "gh workflow run swift-package-release.yml --repo github.com/$GITHUB_REPOSITORY --ref main -f version=$RELEASE_VERSION -f source_sha=$SOURCE_SHA" '```' '' \
              'Copy these values into the release form for this ecosystem once the preflight run succeeds.' '' \
              '**Version**' '```text' "$RELEASE_VERSION" '```' '' \
              '**Source SHA**' '```text' "$SOURCE_SHA" '```' >>"$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write release inputs to the GitHub Actions summary." >&2
          fi

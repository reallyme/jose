name: Check repository privacy
description: Reject tracked local-only files throughout the candidate history.
runs:
  using: composite
  steps:
    - name: Install privacy-check runtime
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - name: Inspect index and history
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../../../scripts/check_repository_privacy.py" index
        python3 "$GITHUB_ACTION_PATH/../../../scripts/check_repository_privacy.py" history HEAD
